name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go-checks:
    name: Go checks and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Go tests
        # Race detector requires CGO_ENABLED=1 which is not supported in this build.
        # See docs/development/build.md for details.
        run: go test ./internal/...

  frontend-tests:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  build-windows:
    name: Windows x64 application build
    runs-on: windows-latest
    # Runs the full wails3 build which covers:
    # - go mod tidy
    # - TypeScript binding generation
    # - npm install
    # - tsc + vite build (frontend type check + production bundle)
    # - go build -tags production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (includes TypeScript check and frontend build)
        run: wails3 build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: meiliscope-windows-amd64
          path: bin/meiliscope.exe
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Linux amd64 application build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies (GTK3 + WebKit2GTK)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            pkg-config \
            libglib2.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (includes TypeScript check and frontend build)
        run: wails3 build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: meiliscope-linux-amd64
          path: bin/meiliscope
          if-no-files-found: error
          retention-days: 7
